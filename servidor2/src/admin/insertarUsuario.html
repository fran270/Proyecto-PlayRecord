<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      type="text/css"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
    />
    <title>Insertar Usuario</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="icon" href="./img/agregarUsuario.png" type="image/x-icon" />
    <link href="./css/estilos.css" rel="stylesheet" />
    <script src="../usuario/js/validarRegistro.js"></script>
  </head>

  <body>
    <style>
      #contenedor {
        text-align: center;
      }

      #campo1,
      #campo2,
      #campo3,
      #campo4,
      #campo5 {
        margin: auto;
      }
    </style>

    <div id="contenedor">
      <div id="co2">
        <br />
        <form action="insertar_usuario.php" id="formulario" method="POST">
          <img src="./img/agregarUsuario.png" id="imagen1" />
          <b id="titulo">Insertar nuevo usuario</b>
          <br /><br />

          <div class="form-group col-md-3" id="campo1">
            <input
              type="text"
              name="usuario"
              id="usuario"
              class="form-control"
              placeholder="Usuario"
            />
          </div>

          <span id="errorUsuario"></span>

          <div class="form-group col-md-3" id="campo2">
            <input
              type="password"
              name="contraseña"
              id="contraseña"
              class="form-control"
              placeholder="Contraseña"
            />
          </div>

          <span id="errorContrasena"></span>

          <div class="form-group col-md-3" id="campo3">
            <input
              type="date"
              name="fecha_nacimiento"
              id="fecha_nacimiento"
              class="form-control"
              placeholder="Fecha_nacimiento"
            />
          </div>

          <div class="form-group col-md-3" id="campo4">
            <input
              type="email"
              name="correo"
              id="correo"
              class="form-control"
              placeholder="Email"
            />
          </div>

          <span id="errorEmail"></span>

          <br />

          <div class="form-group cold-md-3">
            <button
              type="submit"
              id="boton"
              value="insertar"
              class="btn btn-success"
            >
              <iconify-icon
                icon="material-symbols-light:save-as-outline"
                class="d-inline-block align-top"
                id="iconoInsertar"
              ></iconify-icon
              >Insertar
            </button>
          </div>
        </form>
      </div>

      <br /><br />
    </div>
  </body>
</html>
